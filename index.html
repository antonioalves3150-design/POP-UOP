<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta property="og:title" content="Nike Air Force 1 Premium 🔥">
<meta property="og:description" content="Best Seller • $111 • Toque para ver">
<meta property="og:image" content="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600">
<meta property="og:type" content="website">
<title>Nike Air Force 1 Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: rgba(0, 0, 0, 0.55);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    padding: 20px;
    /* Simula o fundo escurecido do WhatsApp atrás */
    backdrop-filter: blur(2px);
  }

  /* Botão fechar no topo */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    background: #f5f5f0;
    border-radius: 24px 24px 0 0;
  }

  .btn-back {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #e8e8e3;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }

  .btn-close {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #e8e8e3;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }

  /* CARD — tamanho reduzido, igual à imagem de referência */
  .card {
    width: 100%;
    max-width: 320px;       /* ← menor que antes */
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
    animation: popIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    background: #f5f5f0;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.88) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* CAROUSEL */
  .carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: #1a1a1a;
  }

  .slides {
    display: flex;
    width: 400%;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .slide {
    width: 25%;
    height: 100%;
    flex-shrink: 0;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #fff;
    color: #111;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 2;
    letter-spacing: 0.3px;
  }

  .logo-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 38px;
    height: 38px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .dots {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 5px;
    z-index: 2;
  }

  .dot {
    width: 5px;
    height: 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.4);
    transition: all 0.3s;
    cursor: pointer;
  }
  .dot.active { width: 16px; background: white; }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    background: rgba(0,0,0,0.35);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 15px;
    cursor: pointer;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .nav-btn.prev { left: 8px; }
  .nav-btn.next { right: 8px; }

  /* CONTENT */
  .content {
    padding: 16px 16px 18px;
    background: white;
  }

  .product-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    color: #0a0a0a;
    margin-bottom: 2px;
  }

  .tagline {
    font-size: 12px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 6px;
  }

  .description {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .price-tag {
    background: #f0f0eb;
    border-radius: 50px;
    padding: 10px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: #0a0a0a;
    flex-shrink: 0;
  }

  .buy-btn {
    flex: 1;
    background: #0a0a0a;
    color: #e8ff00;
    border: none;
    border-radius: 50px;
    padding: 12px 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 17px;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .buy-btn:active { transform: scale(0.97); }

  .buy-icon {
    width: 18px;
    height: 18px;
    background: #e8ff00;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0a0a0a;
    font-size: 11px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #0a0a0a;
    color: #e8ff00;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    padding: 12px 24px;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card">
  <!-- TOP BAR -->
  <div class="top-bar">
    <button class="btn-back" onclick="history.back()">←</button>
    <button class="btn-close" onclick="window.close()">✕</button>
  </div>

  <!-- CAROUSEL -->
  <div class="carousel">
    <div class="slides" id="slides">
      <div class="slide" style="position:relative">
        <span class="badge">Best Seller</span>
        <div class="logo-badge">NIKE</div>
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=80" alt="Nike AF1">
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=600&q=80" alt="Nike AF1">
      </div>
      <div class="slide">
        <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600&q=80" alt="Nike AF1">
      </div>
      <div class="slide" style="position:relative">
        <span class="badge">🔥 -20% hoje</span>
        <img src="https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=600&q=80" alt="Nike AF1">
      </div>
    </div>

    <button class="nav-btn prev" onclick="slide(-1)">‹</button>
    <button class="nav-btn next" onclick="slide(1)">›</button>

    <div class="dots">
      <div class="dot active" onclick="goTo(0)"></div>
      <div class="dot" onclick="goTo(1)"></div>
      <div class="dot" onclick="goTo(2)"></div>
      <div class="dot" onclick="goTo(3)"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">
    <div class="product-name">Nike Airforce1 Premium</div>
    <div class="tagline">Own the Airforce</div>
    <div class="description">Step back into classic hoops style with a durable leather.</div>

    <div class="bottom-row">
      <div class="price-tag">$111</div>
      <button class="buy-btn" onclick="buyNow()">
        Buy Now
        <div class="buy-icon">↗</div>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast">✅ Pedido enviado no WhatsApp!</div>

<script>
  let current = 0;
  const total = 4;
  const slidesEl = document.getElementById('slides');
  const dots = document.querySelectorAll('.dot');

  function updateCarousel() {
    slidesEl.style.transform = `translateX(-${current * 25}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
  }

  function slide(dir) {
    current = (current + dir + total) % total;
    updateCarousel();
  }

  function goTo(i) { current = i; updateCarousel(); }

  let startX = 0;
  slidesEl.parentElement.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  slidesEl.parentElement.addEventListener('touchend', e => {
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 40) slide(diff > 0 ? 1 : -1);
  });

  function buyNow() {
    const msg = encodeURIComponent(`Olá! Quero comprar:\n👟 *Nike Air Force 1 Premium*\n💰 $111\n\nPode confirmar disponibilidade?`);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
    setTimeout(() => window.open(`https://wa.me/?text=${msg}`, '_blank'), 500);
  }

  setInterval(() => slide(1), 4000);
</script>
</body>
</html>
